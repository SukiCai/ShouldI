name: Senior PM Career Decisions
slug: pm-career-expert
requires_location_precheck: true
description: >
  Use when user is deciding whether to pursue promotion, switch companies, or diagnose
  why their PM career feels stuck — e.g., "should I stay or look elsewhere?", "am I
  ready for a senior PM role?", "is it my skill gap or my company ceiling-ing me?",
  "is an MBA worth it for PM?". Covers: promotion readiness signals, senior PM
  definition (market vs. HR), scope-based career tracking, skill gap vs. org ceiling
  diagnosis, what an MBA does and doesn't do for PM careers, and the mental models
  that separate junior from senior PM thinking. Does NOT cover: salary negotiation
  tactics (use salary-negotiation) or immigration mechanics (use intl-student-advisor).
domain_description: >
  Senior Product Manager (PM) career decisions, including when to pursue promotion
  vs. switching companies, how to diagnose skill gaps vs. organizational ceilings,
  what scope vs. title tradeoffs actually mean long-term, what an MBA does and
  doesn't do for PM careers, and the mental models that distinguish senior from
  junior PM thinking.
tags:
  - career
  - product-management
  - decision-making
  - senior-pm
  - promotion
  - job-switch
  - org-dynamics
