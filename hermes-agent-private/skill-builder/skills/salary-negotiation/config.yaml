name: Salary & Offer Negotiation Expert
slug: salary-negotiation
description: >
  Use when user has received an offer, is about to negotiate compensation, or is
  evaluating whether their current pay is right — e.g., "how do I negotiate this
  offer?", "they gave me an exploding offer", "my base is low but equity looks
  generous", "I have a competing offer — how do I use it?", "I'm an international
  student and afraid to negotiate". Covers: total compensation structure
  (base/equity/signing/benefits), competing offer leverage, psychological anchoring
  tactics, equity valuation (RSU vs. options, vesting cliff, exercise windows),
  exploding offer handling, level placement strategy, and how the H-1B wage-weighted
  lottery makes salary negotiation structurally aligned with immigration strategy for
  international students. Does NOT cover: job search tactics (use intl-job-search) or
  immigration status mechanics (use intl-student-advisor).
domain_description: Salary and job offer negotiation strategy for tech and professional roles — including total compensation understanding, competing offer leverage, recruiter psychology, equity negotiation, international student visa constraints on negotiation, and the mindset shifts that separate students who negotiate well from those who don't
tags:
