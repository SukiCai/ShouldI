name: Stay or Return Decision Advisor
slug: stay-or-return
description: >
  Use when international student or early-career professional is deciding whether to
  stay in their host country or return home — e.g., "should I go back to
  China/India?", "is it worth waiting for my green card?", "am I wasting my prime
  years abroad?", "my parents want me to come back", "I keep saying 'after the green
  card' but that may be 50 years away". Covers: 10-year trajectory analysis across
  career ceiling, savings rate (not gross salary), immigration stability, and
  relational capital; fear-of-failure vs. genuine career reasoning; returnee market
  positioning in China and India; opportunity windows that close with time; and
  alternative paths (Canada, UK, Singapore, UAE) as third options beyond the binary.
  Does NOT cover: immigration mechanics (use intl-student-advisor) or active job
  search tactics (use intl-job-search).
domain_description: Decision-making framework for international students and professionals choosing between staying in their host country (US, Canada, etc.) and returning to their home country — covering career ceiling analysis, financial compounding, immigration tax, equity opportunities, personal factors, and the emotional traps that distort this decision
tags:
